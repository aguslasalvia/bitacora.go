name: Go Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:  # ✅ Permite ejecutarlo manualmente

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: golang:bullseye

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fix git ownership
        run: git config --global --add safe.directory '*'

      - name: Install zip and Node.js
        run: |
          apt-get update && apt-get install -y --no-install-recommends zip
          # bullseye-security está devolviendo 404 para casi todo (paquete
          # viejo purgado del mirror), así que el script de NodeSource
          # (que instala vía apt) no funciona. Bajamos el binario de Node
          # directo de nodejs.org en su lugar.
          curl -fsSL https://nodejs.org/dist/v22.23.3/node-v22.23.3-linux-x64.tar.gz | tar -xz -C /usr/local --strip-components=1

      - name: Build frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Build
        run: |
          mkdir -p bin
          go build -v -o bin/app ./cmd/bitacora/
          cp -r ./scripts bin/
          cp -r ./web bin/

      - name: Test
        run: go test -v ./...

      - name: Package artifact
        run: |
          cd bin
          zip -r ../app.zip .
          cd ..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: app.zip
